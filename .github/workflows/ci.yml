name: clean-build
on: [push, pull_request, workflow_dispatch]
jobs:
  focal:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build from source
        shell: bash
        run: ./setup.sh --install-system
      - name: Tests and build diagnostics
        shell: bash
        run: |
          ./run_tests.sh
          ./doctor.sh --build-only
      - name: Headless public API smoke test
        shell: bash
        run: ./scripts/smoke_headless.sh
